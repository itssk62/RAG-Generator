name: rag-generator

services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      RAG__QDRANT__URL: http://qdrant:6333
    volumes:
      - api_data:/data
      - ./models:/models
      - ./config:/srv/config:ro
    ports:
      - "8000:8000"
    depends_on:
      - qdrant

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy

volumes:
  qdrant_data:
  api_data:
