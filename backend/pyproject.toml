[project]
name = "rag-generator"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pyyaml>=6",
    "qdrant-client>=1.12",
    "fastembed>=0.5",
    "litellm>=1.50",
    "tenacity>=8",  # litellm retries
    "pymupdf>=1.24",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["models: needs the real fastembed models (set RAG_TEST_MODELS=1)"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 130
